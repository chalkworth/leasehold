name: Bug
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to make it happen
      description: Commands, the config (machine.toml) if it matters, and their output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`leasehold doctor` output"
      render: text
  - type: input
    id: version
    attributes:
      label: "`leasehold --version`, distribution and kernel"
      placeholder: leasehold 0.2.0, Debian 13, 6.12
    validations:
      required: true
