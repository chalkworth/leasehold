name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # it publishes no moving major tag
      - run: uv sync --python 3.12
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync lint-imports
      - name: Vendored skills match their lockfile
        run: uvx --from "git+https://github.com/chalkworth/skills@v0.1.0" chalk-skills check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # it publishes no moving major tag
      - run: uv sync --python ${{ matrix.python }} --group bench
      - run: uv run --no-sync pytest -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # it publishes no moving major tag
      - run: uv build
      - name: The wheel carries its package data
        run: |
          python3 - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("leasehold/static/ui.html", "leasehold/templates/machine.toml"):
              assert needed in names, f"{needed} is not in the wheel"
          PY
      - name: It installs and runs from the wheel
        run: |
          uv venv /tmp/try && uv pip install --python /tmp/try/bin/python dist/*.whl
          /tmp/try/bin/leasehold --version
          /tmp/try/bin/leasehold init --print > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
