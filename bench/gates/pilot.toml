# Pilot screen: which ranged defaults are worth a confirmatory gate. It only drops arms and
# never promotes one; its seeds are never pooled with the gate's. Judge with:
#   python bench/run.py compare DIR --gate bench/gates/pilot.toml

[gate]
name = "pilot"
kind = "screen"
intent = "Narrow the candidate heavy-rule weights to the ones a confirmatory gate should test."
objective = "Per arm against fixed 4: the geometric-mean wake p99 and makespan ratios over 3 rounds, and the hard rules."
stop = "3 rounds (seeds 101 to 103), run in full; no early stop."
decision = "The arms that survive, at most two, go to bench/gates/defaults.toml as its candidates, in an order the owner sets."

[arms]
control = "lh-enforced@w=4"
candidates = [
    "lh-enforced@w=3-3,h=1",
    "lh-enforced@w=2-4",
    "lh-enforced@w=2-3,kept=3",
    "lh-enforced@w=4-8",
]

[[workloads]]
name = "full"
args = "--agents 8 --duration 240 --git-repo /var/tmp/bigrepo"

[rounds]
planned = 3
seed_base = 100

[screen]
wake_metric = "wake_same_p99_ms"
wake_ratio_above = 2.0      # drop: geometric mean of the wake p99 ratio above this
makespan_ratio_above = 1.15 # drop: geometric mean of the makespan ratio above this
hard_rules = true           # drop: any failed job, OOM kill or PSI above psi_max in a round
max_survivors = 2
rank_by = "makespan_s"      # which survivors stay when more than max_survivors pass

[hard]
failed_jobs = 0
oom_kills = 0
psi_max = 10.0
