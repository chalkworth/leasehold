# Put the GitHub Actions runner service in runner.slice, so its jobs share that slice's limits
# and leasehold's [load] and pressure_cgroups see them apart. Install as
# /etc/systemd/system/actions.runner.<owner>-<repo>.<runner>.service.d/runner-slice.conf, then
# `systemctl daemon-reload && systemctl restart actions.runner.<...>.service`.
[Service]
Slice=runner.slice
